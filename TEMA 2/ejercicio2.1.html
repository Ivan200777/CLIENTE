<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2.1</title>
</head>
<body>
<script>
    function resta(a, b) {
        return a - b;
    }

    function multiplicacion(a, b) {
        return a * b;
    }

    function division(a, b) {
        return a / b;
    }

    var x = resta(10, 4);
    var y = multiplicacion(x, 3);
    var z = division(y, 2);
    var text = "El valor de z será ahora: " + z;
    alert(text);
</script>
</body>
</html>
