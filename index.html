<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis ejercicios de Cliente</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
  }

  li {
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<h1>Mis ejercicios de Cliente</h1>
<input id="buscar" type="search" placeholder="Buscar archivo">
<ul id="lista"></ul>

<script>
  const usuario = "Ivan200777";
  const repo = "CLIENTE";
  const lista = document.getElementById("lista");
  const buscar = document.getElementById("buscar");
  let archivos = [];

  function mostrar() {
    const texto = buscar.value.toLowerCase();
    lista.innerHTML = "";

    for (const ruta of archivos) {
      if (ruta.toLowerCase().includes(texto)) {
        lista.innerHTML += `<li><a href="${encodeURI(ruta)}">${ruta}</a></li>`;
      }
    }
  }

  fetch(`https://api.github.com/repos/${usuario}/${repo}/git/trees/main?recursive=1`)
    .then(respuesta => respuesta.json())
    .then(datos => {
      archivos = datos.tree
        .filter(f => f.type === "blob")
        .map(f => f.path)
        .filter(p => p.endsWith(".html") && p !== "index.html");
      mostrar();
    });

  buscar.addEventListener("input", mostrar);
</script>

</body>
</html>
