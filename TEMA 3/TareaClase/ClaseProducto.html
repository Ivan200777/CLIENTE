<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
</head>
<body>
<script>
    class Producto {
        constructor(nombre, precio, stock) {
        this.nombre = nombre;
        this.precio = precio;
        this.stock = stock;
    }
    conIVA() { return this.precio * 1.21; }
    vender(n) {if (this.stock >=n){
        this.stock -=n;
        return true;
    } else {
        return false;
    }}
}
     const producto = new Producto("Balón de fútbol", 20, 10);

    console.log(producto.conIVA());
    console.log(producto.vender(3));
    console.log(producto.stock);
</script>
</body>
</html>
