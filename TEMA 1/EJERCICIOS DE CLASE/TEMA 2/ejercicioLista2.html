<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operador ternario en JavaScript</title>
</head>
<body>

    <h1>Operador ternario en JavaScript</h1>

    <p id="resultado"></p>

    <script>
        let edad = 18;

        let resultado = edad >= 18
            ? "Eres mayor de edad"
            : "Eres menor de edad";

        document.getElementById("resultado").textContent = resultado;
    </script>

</body>
</html>
