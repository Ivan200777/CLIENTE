<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj</title>
</head>
<body>
    <h1 id="reloj"></h1>
    <button id="parar">Parar</button>
    <button id="reanudar">Reanudar</button>

    <script>
        const reloj = document.getElementById("reloj");
        let intervalo;

        function mostrarHora() {
            reloj.textContent = new Date().toLocaleTimeString("es-ES");
        }

        function iniciar() {
            mostrarHora();
            intervalo = setInterval(mostrarHora, 1000);
        }

        document.getElementById("parar").addEventListener("click", function () {
            clearInterval(intervalo);
        });

        document.getElementById("reanudar").addEventListener("click", function () {
            clearInterval(intervalo);
            iniciar();
        });

        iniciar();
    </script>
</body>
</html>
