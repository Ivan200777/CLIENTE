<!DOCTYPE html>
<html>
<body>

<h1 id="titulo">Título original</h1>

<p id="parrafo">Contenido del párrafo</p>

<button type="button"
        onclick="document.getElementById('parrafo').innerHTML = 'El contenido del párrafo ha sido modificado'; document.getElementById('titulo').innerHTML = 'Título modificado'">

        Cambiar Texto
</button>

<button type="button"
        onclick="document.getElementById('parrafo').style.color = 'red'">

        Cambiar Estilos CSS
</button>

</body>
</html>
