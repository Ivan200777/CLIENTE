<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis ejercicios de Cliente</title>
<style>
  :root {
    --cesped: #1c6a38;
    --cesped-claro: #217a41;
    --azul: #004d98;
    --grana: #a50044;
    --texto: #10202a;
    --suave: #5b6b76;
    --linea: #e3e8ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: repeating-linear-gradient(90deg, var(--cesped) 0 90px, var(--cesped-claro) 90px 180px);
    min-height: 100vh;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
 
  .campo {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 36px 32px;
    margin-bottom: 24px;
    border-radius: 14px;
    overflow: hidden;
    color: #fff;
  }
  .campo svg.lineas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    stroke: rgba(255, 255, 255, .55);
    fill: none;
    stroke-width: 2;
  }
  .campo > * { position: relative; }
  h1 { font-size: 2.3rem; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; }
  .campo p { margin: 0; opacity: .9; }
  #balon { width: 110px; height: 110px; flex: none; }
  #foto {
    width: 160px;
    height: 200px;
    flex: none;
    object-fit: cover;
    border-radius: 12px;
    border: 3px solid #fff;
  }
 
  .caja {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  }
  #buscar {
    width: 100%;
    padding: 14px 18px;
    font: inherit;
    color: inherit;
    border: 0;
    border-bottom: 1px solid var(--linea);
    background: #fff;
  }
  #buscar:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--azul);
    outline-offset: -2px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { border-top: 1px solid var(--linea); }
  a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    color: var(--texto);
    text-decoration: none;
    border-left: 4px solid transparent;
  }
  a::before {
    content: "";
    width: 20px;
    height: 20px;
    flex: none;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='white' stroke='%2310202a' stroke-width='1.5'/><polygon points='12,7 16,10 14.5,15 9.5,15 8,10' fill='%2310202a'/></svg>") center / contain no-repeat;
  }
  a:hover { background: #f3f6f8; border-left-color: var(--grana); }
  summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: 700;
    color: var(--azul);
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: "";
    width: 8px;
    height: 8px;
    margin: 0 6px 0 3px;
    border-right: 2px solid var(--grana);
    border-bottom: 2px solid var(--grana);
    transform: rotate(-45deg);
    transition: transform .15s;
  }
  details[open] > summary::before { transform: rotate(45deg); }
  summary:hover { background: #f3f6f8; }
  details > ul { border-top: 1px solid var(--linea); padding-left: 20px; background: #fafbfc; }
  .vacio { padding: 22px 18px; margin: 0; color: var(--suave); }
 
  @media (max-width: 560px) {
    .campo { flex-direction: column; align-items: flex-start; padding: 28px 22px; }
    h1 { font-size: 1.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    summary::before { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header class="campo">
    <svg class="lineas" viewBox="0 0 800 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect x="12" y="12" width="776" height="236"/>
      <line x1="400" y1="12" x2="400" y2="248"/>
      <circle cx="400" cy="130" r="46"/>
      <rect x="12" y="70" width="110" height="120"/>
      <rect x="678" y="70" width="110" height="120"/>
    </svg>
    <div>
      <h1>Mis ejercicios de Cliente</h1>
      <p>Elige un archivo para abrirlo.</p>
    </div>
    <svg id="balon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10.5" fill="#fff" stroke="#10202a" stroke-width="1"/>
      <polygon points="12,6.5 16.3,9.6 14.7,14.7 9.3,14.7 7.7,9.6" fill="#10202a"/>
      <path d="M12 6.5V2M16.3 9.6l4.2-1.4M14.7 14.7l2.6 3.7M9.3 14.7l-2.6 3.7M7.7 9.6L3.5 8.2" stroke="#10202a" stroke-width="1" fill="none"/>
    </svg>
    <img id="foto" src="img/lamine.jpg" alt="Lamine Yamal" hidden>
  </header>
 
  <div class="caja">
    <input id="buscar" type="search" placeholder="Buscar archivo" aria-label="Buscar archivo">
    <div id="lista"><p class="vacio">Cargando...</p></div>
  </div>
</main>
<script>
  const USUARIO = "Ivan200777";
  const REPO = "CLIENTE";
  const RAMA = "main";
  const IGNORAR = ["index.html", ".nojekyll", "README.md"];
 
  const lista = document.getElementById("lista");
  const buscar = document.getElementById("buscar");
  const foto = document.getElementById("foto");
  const balon = document.getElementById("balon");
 
  const mostrarFoto = () => { foto.hidden = false; balon.hidden = true; };
  if (foto.complete && foto.naturalWidth) mostrarFoto();
  foto.addEventListener("load", mostrarFoto);
 
  const ordenar = (a, b) => a.localeCompare(b, "es", { numeric: true, sensitivity: "base" });
 
  function construirArbol(rutas) {
    const raiz = { carpetas: {}, archivos: [] };
    for (const ruta of rutas) {
      const partes = ruta.split("/");
      let nodo = raiz;
      for (const parte of partes.slice(0, -1)) {
        nodo.carpetas[parte] ??= { carpetas: {}, archivos: [] };
        nodo = nodo.carpetas[parte];
      }
      nodo.archivos.push(ruta);
    }
    return raiz;
  }
 
  function pintar(nodo) {
    const ul = document.createElement("ul");
    for (const nombre of Object.keys(nodo.carpetas).sort(ordenar)) {
      const li = document.createElement("li");
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = nombre;
      det.append(sum, pintar(nodo.carpetas[nombre]));
      li.append(det);
      ul.append(li);
    }
    for (const ruta of nodo.archivos.sort(ordenar)) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = ruta.split("/").map(encodeURIComponent).join("/");
      a.textContent = ruta.split("/").pop();
      li.append(a);
      ul.append(li);
    }
    return ul;
  }
 
  function filtrar() {
    const q = buscar.value.trim().toLowerCase();
    lista.querySelectorAll("li > a").forEach(a => {
      a.parentElement.hidden = q !== "" && !a.textContent.toLowerCase().includes(q);
    });
    lista.querySelectorAll("details").forEach(det => {
      const hay = det.querySelector("li:not([hidden]) > a");
      det.parentElement.hidden = q !== "" && !hay;
      if (q && hay) det.open = true;
    });
  }
 
  fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/git/trees/${RAMA}?recursive=1`)
    .then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(datos => {
      const rutas = datos.tree
        .filter(f => f.type === "blob")
        .map(f => f.path)
        .filter(p => !IGNORAR.includes(p) && !p.startsWith(".") && !p.startsWith("img/") && /\.(html?|pdf|txt|md)$/i.test(p));
      if (!rutas.length) {
        lista.innerHTML = '<p class="vacio">No hay archivos todavía.</p>';
        return;
      }
      lista.replaceChildren(pintar(construirArbol(rutas)));
    })
    .catch(() => {
      lista.innerHTML = '<p class="vacio">No se pudo cargar la lista. Recarga la página en unos minutos.</p>';
    });
 
  buscar.addEventListener("input", filtrar);
</script>
</body>
</html>
