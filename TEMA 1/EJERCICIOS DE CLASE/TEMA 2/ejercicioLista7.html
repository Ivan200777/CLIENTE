<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
</head>
<body>

    <h1>Ejercicio 4</h1>

    <script>
        console.log(Number("9 9"));
        console.log(Number("dos"));
    </script>

    <h2>Explicación</h2>

    <p>
        Number("9 9") da como resultado NaN porque "9 9" no es un número válido.
    </p>

    <p>
        Number("dos") también da como resultado NaN porque "dos" es texto y no se puede convertir en número.
    </p>

</body>
</html>
