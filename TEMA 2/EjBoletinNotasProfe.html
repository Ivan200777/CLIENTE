<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletín de notas - Notas</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    max-width: 860px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 { text-align: center; }

  .panel {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  input {
    padding: 6px;
    font-size: 15px;
    border: 1px solid #94a3b8;
    border-radius: 6px;
  }

  input[type="number"] {
    width: 60px;
  }

  select {
    padding: 7px;
    font-size: 15px;
    border: 1px solid #94a3b8;
    border-radius: 6px;
  }

  button {
    padding: 7px 12px;
    margin: 4px 2px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    background: #1d4ed8;
    color: white;
  }

  button:hover {
    background: #1e40af;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th, td {
    border: 1px solid #cbd5e1;
    padding: 8px;
    text-align: center;
  }

  th {
    background: #e2e8f0;
  }

  .suspenso {
    background: #fee2e2;
    color: #991b1b;
  }

  .aprobado {
    background: #dcfce7;
    color: #166534;
  }

  #mensaje {
    font-weight: bold;
    margin-top: 8px;
  }

  pre {
    background: #0f172a;
    color: #f1f5f9;
    padding: 16px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<h1>Boletín de notas de la clase</h1>

<div class="panel">
  <h2>Notas por trimestre</h2>
  <div id="tabla"></div>
</div>

<div class="panel">
  <h2>Añadir alumno</h2>

  Nombre: <input type="text" id="nuevoNombre">

  1T: <input type="number" id="n1" min="0" max="10">

  2T: <input type="number" id="n2" min="0" max="10">

  3T: <input type="number" id="n3" min="0" max="10">

  <button onclick="anadirAlumno()">Añadir</button>

  <div id="mensaje"></div>
</div>

<div class="panel">
  <h2>Consultas</h2>

  <button onclick="contarAprobados()">Contar aprobados</button>

  <button onclick="mejorNota()">Mejor nota de la clase</button>

  <select id="trimestre">
    <option value="0">1º trimestre</option>
    <option value="1">2º trimestre</option>
    <option value="2">3º trimestre</option>
  </select>

  <button onclick="mediaTrimestre()">Media de un trimestre</button>

  <input type="text" id="buscar" placeholder="Nombre">

  <button onclick="buscarAlumno()">Buscar alumno</button>

  <h3>Resultado</h3>

  <pre id="resultado"></pre>
</div>

<script>

  let alumnos = ["Ana", "Luis", "Marta", "Pablo", "Sara"];

  let notas = [
    [7, 8, 9],
    [4, 5, 6],
    [3, 4, 2],
    [9, 10, 9],
    [5, 4, 6]
  ];


  function mediaAlumno(fila) {

    let suma = 0;

    for (let c = 0; c < notas[fila].length; c++) {

      suma = suma + notas[fila][c];

    }

    return suma / notas[fila].length;
  }


  function calificacion(nota) {

    if (nota < 5) {

      return "Insuficiente";

    } else if (nota < 6) {

      return "Suficiente";

    } else if (nota < 7) {

      return "Bien";

    } else if (nota < 9) {

      return "Notable";

    } else {

      return "Sobresaliente";

    }
  }


  function pintarTabla() {

    let html = "<table>";

    html = html + "<tr><th>Alumno</th><th>1T</th><th>2T</th><th>3T</th><th>Media</th><th>Calificación</th></tr>";


    for (let f = 0; f < notas.length; f++) {

      html = html + "<tr>";

      html = html + "<td>" + alumnos[f] + "</td>";


      for (let c = 0; c < notas[f].length; c++) {

        let nota = notas[f][c];

        if (nota >= 5) {

          html = html + "<td class='aprobado'>" + nota + "</td>";

        } else {

          html = html + "<td class='suspenso'>" + nota + "</td>";

        }
      }


      let media = mediaAlumno(f);

      html = html + "<td><b>" + media.toFixed(2) + "</b></td>";

      html = html + "<td>" + calificacion(media) + "</td>";

      html = html + "</tr>";
    }


    html = html + "</table>";

    document.getElementById("tabla").innerHTML = html;
  }


  function anadirAlumno() {

    let nombre = document.getElementById("nuevoNombre").value;

    let n1 = Number(document.getElementById("n1").value);

    let n2 = Number(document.getElementById("n2").value);

    let n3 = Number(document.getElementById("n3").value);


    if (nombre === "") {

      document.getElementById("mensaje").innerHTML =
        "Error: escribe un nombre.";

      return;
    }


    if (n1 < 0 || n1 > 10 || n2 < 0 || n2 > 10 || n3 < 0 || n3 > 10) {

      document.getElementById("mensaje").innerHTML =
        "Error: las notas deben estar entre 0 y 10.";

      return;
    }


    alumnos.push(nombre);

    notas.push([n1, n2, n3]);


    document.getElementById("mensaje").innerHTML =
      "Añadido " + nombre + ". Ahora hay " + alumnos.length + " alumnos.";

    pintarTabla();
  }


  function contarAprobados() {

    let aprobados = 0;


    for (let f = 0; f < notas.length; f++) {

      if (mediaAlumno(f) >= 5) {

        aprobados++;

      }
    }


    let texto = "";

    texto = texto + "Aprobados: " + aprobados;

    texto = texto + " de " + alumnos.length;


    document.getElementById("resultado").textContent = texto;

  }


  function mejorNota() {

    let mejorMedia = 0;

    let mejorAlumno = 0;


    for (let m = 0; m < notas.length; m++) {

      let media = mediaAlumno(m);


      if (media > mejorMedia) {

        mejorMedia = media;

        mejorAlumno = m;

      }
    }


    let texto = "";

    texto = texto + "La mejor nota es la de ";

    texto = texto + alumnos[mejorAlumno];

    texto = texto + " con una media de ";

    texto = texto + mejorMedia.toFixed(2);


    document.getElementById("resultado").textContent = texto;

  }


  function mediaTrimestre() {

    let trimestre = Number(document.getElementById("trimestre").value);

    let suma = 0;


    for (let f = 0; f < notas.length; f++) {

      suma = suma + notas[f][trimestre];

    }


    let media = suma / alumnos.length;


    let texto = "";

    texto = texto + "La media del ";


    if (trimestre === 0) {

      texto = texto + "1º trimestre";

    } else if (trimestre === 1) {

      texto = texto + "2º trimestre";

    } else {

      texto = texto + "3º trimestre";

    }


    texto = texto + " es: " + media.toFixed(2);


    document.getElementById("resultado").textContent = texto;

  }


  function buscarAlumno() {

    let nombre = document.getElementById("buscar").value;

    let encontrado = false;


    for (let i = 0; i < alumnos.length; i++) {

      if (alumnos[i].toLowerCase() === nombre.toLowerCase()) {

        let media = mediaAlumno(i);

        let texto = "";

        texto = texto + "Alumno: " + alumnos[i];

        texto = texto + "\nMedia: " + media.toFixed(2);

        texto = texto + "\nCalificación: " + calificacion(media);


        document.getElementById("resultado").textContent = texto;

        encontrado = true;

      }
    }


    if (encontrado === false) {

      document.getElementById("resultado").textContent =
        "No se ha encontrado al alumno.";

    }

  }


  pintarTabla();

</script>

</body>
</html>
